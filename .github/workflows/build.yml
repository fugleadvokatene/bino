name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci
        working-directory: frontend
      - run: just build
      # Generated code (templ, sqlc, go-enum, sass, frontend bundle) is committed,
      # so dependency bumps must come with regenerated output.
      - name: Check generated code is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated code is out of date. Run 'just gen' and commit the result."
            exit 1
          fi
      - run: just test
